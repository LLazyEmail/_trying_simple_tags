name: Visual Review

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  visual-review:
    name: Visual Component Review
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run visual review test suite
        run: npm run test:visual

      - name: Upload visual review output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-review-output
          path: |
            **/*.log
          retention-days: 7
